name: PR Checks

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🩺 Expo doctor
        run: npx expo-doctor

      - name: 🔬 Lint
        run: npm run lint

      - name: 🧼 Format
        run: npm run format

      - name: 📝 Typescript
        run: npm run typecheck

      - name: 🧪 Test
        run: npm test -- --ci

      - name: 🍎 iOS bundle export
        run: npx expo export -p ios

      - name: 🤖 Android bundle export
        run: npx expo export -p android
